<section class="container text-white mt-5">
  <h2>Formulario de alta de usuarios</h2>
  <hr />
  <form [formGroup]="userForm" (ngSubmit)="getDataForm()">
    <div class="mb-3">
      <label for="first_name" class="form-label">Nombre</label>
      <input
        type="text"
        id="first_name"
        class="form-control"
        formControlName="first_name"
      />
    </div>
    <div class="mb-3">
      <label for="last_name" class="form-label">Apellidos</label>
      <input
        type="text"
        id="last_name"
        class="form-control"
        formControlName="last_name"
      />
    </div>
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input
        type="text"
        id="email"
        class="form-control"
        formControlName="email"
      />
    </div>
    <div class="mb-3">
      <label for="username" class="form-label">Nombre de usuario</label>
      <input
        type="text"
        id="username"
        class="form-control"
        formControlName="username"
      />
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Contraseña</label>
      <input
        type="password"
        id="password"
        class="form-control"
        formControlName="password"
      />
    </div>
    <div class="mb-3">
      <label for="repitepassword" class="form-label"
        >Repite la contraseña</label
      >
      <input
        type="password"
        id="repitepassword"
        class="form-control"
        formControlName="repitepassword"
      />
    </div>
    <input
      type="submit"
      value="Enviar"
      class="btn btn-primary mt-3"
      [disabled]="userForm.invalid"
    />
  </form>
</section>
